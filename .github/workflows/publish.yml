name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: use latest npm
        run: npm install -g npm@latest
      - name: verify release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: verify checksums
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: test
        run: npm test
      - name: verify packed files
        run: npm pack --dry-run
      - name: publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          package="$(node -p "require('./package.json').name")"
          if npm view "$package@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$package@$version is already published"
            exit 0
          fi
          if [[ "$version" == *-* ]]; then
            npm publish --tag dev --access public
          else
            npm publish --access public
          fi
